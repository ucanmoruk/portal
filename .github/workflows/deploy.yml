name: Deploy to cPanel via FTP tarball (lab.uniqueanalyse.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build (Next.js standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Assemble deploy bundle
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/node_modules/@sparticuz/chromium/bin
          cp -r node_modules/@sparticuz/chromium/bin/. deploy/node_modules/@sparticuz/chromium/bin/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          node -e 'require("fs").writeFileSync("deploy/.next/static/deployment.json", JSON.stringify({commit:process.env.GITHUB_SHA}))'
          mkdir -p deploy/public
          cp -r public/. deploy/public/
          mkdir -p deploy/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ build:${GITHUB_SHA}" > deploy/tmp/restart.txt

      - name: Create tarball
        run: |
          set -euo pipefail
          tar -czf deploy.tar.gz -C deploy .
          ls -lh deploy.tar.gz
          echo "Files in tarball: $(tar -tzf deploy.tar.gz | wc -l)"
          tar -tzf deploy.tar.gz | grep -E '^./node_modules/@sparticuz/chromium/bin/(chromium|fonts|swiftshader|al2023)\.tar\.br$|^./node_modules/@sparticuz/chromium/bin/chromium\.br$'

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload tarball via FTP (atomic rename)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          FTP_BASE_DIR="${FTP_SERVER_DIR%/}"
          if [[ "$FTP_BASE_DIR" == */_incoming ]]; then
            FTP_INCOMING_DIR="$FTP_BASE_DIR"
          else
            FTP_INCOMING_DIR="$FTP_BASE_DIR/_incoming"
          fi
          if [[ -z "$FTP_BASE_DIR" ]]; then
            FTP_BASE_DIR="."
            FTP_INCOMING_DIR="_incoming"
          fi

          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 10;
            set ftp:passive-mode on;
            set ftp:sync-mode off;
            set xfer:clobber on;
            open ftp://$FTP_SERVER;
            user '$FTP_USERNAME' '$FTP_PASSWORD';
            set cmd:fail-exit no;
            mkdir -p '$FTP_INCOMING_DIR';
            set cmd:fail-exit yes;
            cd '$FTP_INCOMING_DIR';
            put deploy.tar.gz -o deploy.tar.gz.uploading;
            mv deploy.tar.gz.uploading deploy.tar.gz;
            bye;
          "
          echo "Tarball yüklendi → sunucudaki cron extract edecek (10-15 dk sürebilir)."

      - name: Verify live deployment and diagnose extraction
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          # Sunucudaki cron extract + restart pratikte 10-15 dk sürebiliyor; 20 dk bekle.
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 15 "https://lab.uniqueanalyse.com/_next/static/deployment.json?commit=$GITHUB_SHA" -o live-deployment.json && node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("live-deployment.json","utf8")); process.exit(value.commit===process.env.GITHUB_SHA?0:1)'; then
              echo "Live application serves commit $GITHUB_SHA"
              exit 0
            fi
            sleep 30
          done
          echo "::error::FTP upload completed, but the live application is not serving the expected commit. Checking server extraction logs."
          FTP_BASE_DIR="${FTP_SERVER_DIR%/}"
          if [[ "$FTP_BASE_DIR" == */_incoming ]]; then
            FTP_INCOMING_DIR="$FTP_BASE_DIR"
            FTP_APP_DIR="${FTP_BASE_DIR%/_incoming}"
          else
            FTP_APP_DIR="${FTP_BASE_DIR:-.}"
            FTP_INCOMING_DIR="$FTP_APP_DIR/_incoming"
          fi
          lftp -c "
            set net:timeout 20;
            set net:max-retries 1;
            set ftp:ssl-allow no;
            open ftp://$FTP_SERVER;
            user '$FTP_USERNAME' '$FTP_PASSWORD';
            set cmd:fail-exit no;
            cls -l '$FTP_INCOMING_DIR';
            get '$FTP_INCOMING_DIR/extract-deploy.log' -o extraction.log;
            get '$FTP_APP_DIR/tmp/restart.txt' -o restart-marker.txt;
            bye;
          " || true
          if [[ -f extraction.log ]]; then tail -n 35 extraction.log; fi
          if [[ -f restart-marker.txt ]]; then cat restart-marker.txt; fi
          exit 1
