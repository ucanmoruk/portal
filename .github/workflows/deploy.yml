name: Deploy to cPanel via FTP tarball (lab.uniqueanalyse.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build (Next.js standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Assemble deploy bundle
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/node_modules/@sparticuz/chromium/bin
          cp -r node_modules/@sparticuz/chromium/bin/. deploy/node_modules/@sparticuz/chromium/bin/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          mkdir -p deploy/public
          cp -r public/. deploy/public/
          mkdir -p deploy/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ build:${GITHUB_SHA}" > deploy/tmp/restart.txt

      - name: Create tarball
        run: |
          set -euo pipefail
          tar -czf deploy.tar.gz -C deploy .
          ls -lh deploy.tar.gz
          echo "Files in tarball: $(tar -tzf deploy.tar.gz | wc -l)"
          tar -tzf deploy.tar.gz | grep -E '^./node_modules/@sparticuz/chromium/bin/(chromium|fonts|swiftshader|al2023)\.tar\.br$|^./node_modules/@sparticuz/chromium/bin/chromium\.br$'

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload tarball via FTP (atomic rename)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          FTP_BASE_DIR="${FTP_SERVER_DIR%/}"
          if [[ "$FTP_BASE_DIR" == */_incoming ]]; then
            FTP_INCOMING_DIR="$FTP_BASE_DIR"
          else
            FTP_INCOMING_DIR="$FTP_BASE_DIR/_incoming"
          fi
          if [[ -z "$FTP_BASE_DIR" ]]; then
            FTP_BASE_DIR="."
            FTP_INCOMING_DIR="_incoming"
          fi

          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 10;
            set ftp:passive-mode on;
            set ftp:sync-mode off;
            set xfer:clobber on;
            open ftp://$FTP_SERVER;
            user '$FTP_USERNAME' '$FTP_PASSWORD';
            mkdir -p '$FTP_INCOMING_DIR';
            cd '$FTP_INCOMING_DIR';
            put deploy.tar.gz -o deploy.tar.gz.uploading;
            mv deploy.tar.gz.uploading deploy.tar.gz;
            bye;
          "
          echo "Tarball yüklendi → sunucudaki cron 1 dk içinde extract eder."
